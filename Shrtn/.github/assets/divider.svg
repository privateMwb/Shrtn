<svg width="1200" height="56" viewBox="0 0 1200 56" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="lg" x1="40" y1="0" x2="548" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rg" x1="652" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="1"/>
      <stop offset="55%" stop-color="#F5A623" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rules: teal fades in from the left, amber fades out to the right -->
  <rect x="40" y="27" width="508" height="2" rx="1" fill="url(#lg)"/>
  <rect x="652" y="27" width="508" height="2" rx="1" fill="url(#rg)"/>

  <!-- Centre: a chain link between two end caps -->
  <circle cx="560" cy="28" r="3" fill="#5EEAD4" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="28" r="3" fill="#F5A623" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <rect x="-13" y="-6.5" width="20" height="13" rx="6.5" transform="translate(593 28)" stroke="#5EEAD4"/>
    <rect x="-7" y="-6.5" width="20" height="13" rx="6.5" transform="translate(607 28)" stroke="#F5A623"/>
  </g>
</svg>
