<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shrtn: a URL shortener built on FalconHTTP and MiniDB">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E11"/>
      <stop offset="100%" stop-color="#12161B"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F5A623" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="78%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#0B0E11" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B0E11" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1A1F26"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glowBg)"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- Eyebrow: live status -->
  <circle cx="86" cy="86" r="4.5" fill="#5EEAD4">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="102" y="90" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="12" letter-spacing="2.5" fill="#6B7280">SHORTEN  ·  REDIRECT  ·  COUNT</text>

  <!-- Title -->
  <text x="80" y="170" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="88" font-weight="800" letter-spacing="1" fill="url(#title)" filter="url(#glow)">Shrtn</text>
  <rect x="82" y="188" width="400" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- Tagline -->
  <text x="82" y="224" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="19" fill="#9CA3AF">A URL shortener built on FalconHTTP and MiniDB.</text>

  <!-- Feature chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600"
     letter-spacing="1" text-anchor="middle" fill="#5EEAD4">
    <rect x="82"  y="244" width="140" height="26" rx="13" fill="#12161B" stroke="#1F2A33"/>
    <text x="152" y="261">BASE62 CODES</text>
    <rect x="234" y="244" width="140" height="26" rx="13" fill="#12161B" stroke="#1F2A33"/>
    <text x="304" y="261">CLICK COUNTS</text>
    <rect x="386" y="244" width="144" height="26" rx="13" fill="#12161B" stroke="#1F2A33"/>
    <text x="458" y="261">PRIVATE LINKS</text>
    <rect x="542" y="244" width="136" height="26" rx="13" fill="#12161B" stroke="#1F2A33"/>
    <text x="610" y="261">RATE LIMITED</text>
  </g>

  <!-- The shortener: long URL in, short code out, clicks counted -->

  <!-- Long URL (dim) -->
  <rect x="700" y="62" width="440" height="34" rx="17" fill="#12161B" stroke="#1F2A33" stroke-width="1.5"/>
  <text x="724" y="83" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="11" fill="#6B7280" textLength="392" lengthAdjust="spacingAndGlyphs">https://example.com/articles/2026/08/very-long-path?utm=x</text>
  <!-- strike-through that sweeps across the long URL on each cycle -->
  <rect x="716" y="78" width="408" height="2" rx="1" fill="#F5A623" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.1;0.2;0.55;0.7" dur="4.8s" repeatCount="indefinite"/>
  </rect>

  <!-- POST /shorten -->
  <path d="M920 100 L920 140" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="4 5" marker-end="url(#arrowTeal)">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="936" y="124" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="10" letter-spacing="1.5" fill="#6B7280">POST /shorten</text>

  <!-- Short link (hero) -->
  <rect x="700" y="146" width="250" height="44" rx="22" fill="#0B0E11" stroke="url(#title)" stroke-width="2" filter="url(#glow)"/>
  <g fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round">
    <rect x="-9" y="-4.5" width="13" height="9" rx="4.5" transform="translate(724 168) rotate(-45)"/>
    <rect x="-4" y="-4.5" width="13" height="9" rx="4.5" transform="translate(731 161) rotate(-45)"/>
  </g>
  <text x="752" y="175" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="22" font-weight="700" fill="#5EEAD4">/j3dche</text>

  <!-- 302 redirect arrow -->
  <path d="M954 168 L990 168" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="4 5" marker-end="url(#arrowAmber)">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="972" y="158" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="9" letter-spacing="1" fill="#6B7280">302</text>

  <!-- Click counter -->
  <rect x="994" y="146" width="146" height="44" rx="12" fill="#12161B" stroke="#1F2A33" stroke-width="1.5"/>
  <text x="1010" y="164" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" font-weight="600" letter-spacing="1.6" fill="#6B7280">CLICKS</text>
  <g font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="19" font-weight="700" fill="#F5A623">
    <text x="1010" y="184" opacity="1">1,281
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.3;0.31;0.7;0.99;1" dur="4.8s" repeatCount="indefinite"/>
    </text>
    <text x="1010" y="184" opacity="0">1,282
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.31;0.65;0.66;1" dur="4.8s" repeatCount="indefinite"/>
    </text>
    <text x="1010" y="184" opacity="0">1,283
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.65;0.66;0.69;0.7;0.99;1" dur="4.8s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- +1 blip beside the counter -->
  <text x="1124" y="164" text-anchor="end" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="10" font-weight="700" fill="#5EEAD4" opacity="0">+1
    <animate attributeName="opacity" values="0;0;1;0;0;1;0" keyTimes="0;0.29;0.31;0.45;0.64;0.66;0.8" dur="4.8s" repeatCount="indefinite"/>
  </text>

  <!-- Readout -->
  <text x="700" y="224" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="11" letter-spacing="1.5" fill="#6B7280">GET /j3dche  ·  302 Found  ·  clicks +1</text>

  <!-- Click sparkline, drawn in on a loop -->
  <path d="M700 262 L740 256 L780 259 L820 250 L860 253 L900 244 L940 247 L980 240 L1020 243 L1060 238 L1100 241 L1140 236"
        fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="470" stroke-dashoffset="470">
    <animate attributeName="stroke-dashoffset" values="470;0;0;470" keyTimes="0;0.5;0.9;1" dur="4.8s" repeatCount="indefinite"/>
  </path>
</svg>
