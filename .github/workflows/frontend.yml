# ============================================================
# .github/workflows/frontend.yml
# Installs and builds the frontend/ Vite + React app.
#
# Build-only for now: no ESLint/Prettier config exists in
# frontend/ yet, so there's no lint step to run. This catches
# broken builds (syntax errors, missing deps, failed imports)
# but not style/quality issues — add a lint step once a config
# exists, rather than pretend one is running today.
# ============================================================

name: Frontend

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules needed — frontend/ never touches server/third_party/.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
