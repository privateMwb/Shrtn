# ============================================================
# .github/workflows/clang-format.yml
# Checks that all first-party source files are clang-format
# clean on every push and pull request.
#
# Scoped to server/include and server/src only — third_party/
# (falconhttp/, minidb/) is untouched vendored code, not
# FalconEye's own, and frontend/ is JS/JSX, outside
# clang-format's domain (a separate Prettier/ESLint check would
# be the equivalent there, not set up yet).
# ============================================================

name: Clang Format

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt update && sudo apt install -y clang-format

      - name: Check formatting
        run: |
          find server/include server/src \
            \( -name "*.h" -o -name "*.hpp" -o -name "*.cpp" -o -name "*.tpp" \) \
            -exec clang-format --dry-run --Werror {} +
